<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LN Marketing — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#16161f;--bg4:#1c1c28;--border:#2a2a3a;--text:#e8e8f0;--muted:#7070a0;--preview:#94a3b8;--accent:#6c63ff;--red:#ef4444;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--yellow:#eab308}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
#topbar{position:fixed;top:0;left:0;right:0;z-index:200;height:48px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 14px;overflow-x:auto}
#topbar::-webkit-scrollbar{display:none}
.tb-brand{font-weight:700;font-size:15px;color:#fff;margin-right:4px;white-space:nowrap;flex-shrink:0}
.tb-brand span{color:var(--accent)}
.tb-div{width:1px;height:24px;background:var(--border);flex-shrink:0}
.ab{display:flex;align-items:center;gap:5px;padding:4px 11px;background:var(--bg4);border:1px solid var(--border);border-radius:20px;cursor:pointer;white-space:nowrap;font-size:11px;color:var(--muted);flex-shrink:0;transition:all .2s}
.ab:hover{border-color:var(--accent)}.ab.act{border-color:var(--red);background:rgba(239,68,68,.1)}
.ab-n{font-weight:700;font-size:13px;color:var(--red)}
.vp{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;font-size:10px;font-weight:600;border:1px solid transparent;white-space:nowrap;flex-shrink:0}
.vp .d{width:6px;height:6px;border-radius:50%}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0}
.upd{font-size:10px;color:var(--muted);white-space:nowrap}
.btn-r{background:var(--bg4);border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .2s}
.btn-r:hover{color:#fff;border-color:var(--accent)}
#main{position:fixed;top:48px;left:0;right:0;bottom:0;overflow-y:auto;padding:20px}
#main::-webkit-scrollbar{width:5px}
#main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sc{background:var(--bg4);border:1px solid var(--border);padding:2px 9px;border-radius:10px;font-size:11px}
.lead-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:32px}
.lc{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;position:relative}
.lc:hover{border-color:var(--accent);background:var(--bg4);transform:translateY(-1px)}
.lc:active{transform:translateY(0)}
.lc.fech{border-left:4px solid var(--red);background:rgba(239,68,68,.05)}
.lc.fech:hover{border-color:var(--red);background:rgba(239,68,68,.1)}
.lc-badge{position:absolute;top:10px;right:10px;background:rgba(239,68,68,.15);color:var(--red);font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.lc-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.lc-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.lc-info{flex:1;min-width:0}
.lc-name{font-weight:600;font-size:14px;color:#fff;margin-bottom:2px}
.lc-meta{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.lc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.lc-time{font-size:10px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.lc-preview{font-size:12px;color:var(--preview);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;min-height:18px}
.lc-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lc-phone{font-size:10px;color:var(--muted)}
.lc-kw{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;background:rgba(108,99,255,.15);color:var(--accent);text-transform:uppercase}
.lc-open-btn{font-size:10px;color:var(--accent);font-weight:600;background:rgba(108,99,255,.1);border:1px solid rgba(108,99,255,.3);padding:3px 9px;border-radius:6px;white-space:nowrap}
.lc.fech .lc-open-btn{color:var(--red);background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
.em{grid-column:1/-1;text-align:center;padding:32px 16px;color:var(--muted);font-size:13px;line-height:1.7}
#chat-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:flex-start;justify-content:flex-end}
#chat-overlay.open{display:flex}
#chat-panel{width:min(520px,100vw);height:100%;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
#chat-overlay.open #chat-panel{transform:translateX(0)}
#chat-hdr{flex-shrink:0;padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
#chat-hdr .ch-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.ch-nm{font-weight:600;font-size:15px;color:#fff}.ch-sb{font-size:11px;color:var(--muted);margin-top:1px}
.ch-cl{margin-left:auto;background:var(--bg4);border:1px solid var(--border);color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.ch-cl:hover{color:#fff;border-color:#fff;background:rgba(255,255,255,.1)}
#chat-msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
#chat-msgs::-webkit-scrollbar{width:4px}
#chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.mb{max-width:78%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.55;word-break:break-word}
.mb.rcv{background:var(--bg4);color:var(--text);border-bottom-left-radius:3px;align-self:flex-start}
.mb.hum{background:rgba(168,85,247,.22);border:1px solid rgba(168,85,247,.3);color:var(--text);border-bottom-right-radius:3px;align-self:flex-end}
.mb.bot{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.22);color:var(--text);border-bottom-right-radius:3px;align-self:flex-end}
.ms{font-size:9px;font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.ms.hum{color:var(--purple)}.ms.bot{color:var(--green)}
.mt{font-size:9px;color:var(--muted);margin-top:5px;text-align:right}
.ml{text-align:center;color:var(--muted);font-size:12px;padding:24px}
@media(max-width:600px){#main{padding:12px}.lead-grid{grid-template-columns:1fr}#chat-panel{width:100vw}}
</style>
</head>
<body>
<div id="topbar">
  <div class="tb-brand">LN <span>Marketing</span></div>
  <div class="tb-div"></div>
  <div class="ab" id="ab-nv" onclick="fAlert('nv')"><span>👤</span><span class="ab-n" id="cnt-nv">–</span><span>Sem Vendedor</span></div>
  <div class="ab" id="ab-nn" onclick="fAlert('nn')"><span>📋</span><span class="ab-n" id="cnt-nn">–</span><span>Sem Negócio</span></div>
  <div class="ab" id="ab-pd" onclick="fAlert('pd')"><span>⏳</span><span class="ab-n" id="cnt-pd">–</span><span>Pendentes</span></div>
  <div class="tb-div"></div>
  <div class="vp" style="border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.08)"><div class="d" style="background:#22c55e"></div><span style="color:#22c55e">Jeremias</span>&nbsp;<span id="vp-jer" style="color:var(--muted)">–</span></div>
  <div class="vp" style="border-color:rgba(249,115,22,.35);background:rgba(249,115,22,.08)"><div class="d" style="background:#f97316"></div><span style="color:#f97316">Alysson</span>&nbsp;<span id="vp-aly" style="color:var(--muted)">–</span></div>
  <div class="vp" style="border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08)"><div class="d" style="background:#3b82f6"></div><span style="color:#3b82f6">Luan</span>&nbsp;<span id="vp-lua" style="color:var(--muted)">–</span></div>
  <div class="vp" style="border-color:rgba(168,85,247,.35);background:rgba(168,85,247,.08)"><div class="d" style="background:#a855f7"></div><span style="color:#a855f7">Michele</span>&nbsp;<span id="vp-mic" style="color:var(--muted)">–</span></div>
  <div class="tb-r"><span class="upd" id="upd-time">Carregando...</span><button class="btn-r" onclick="loadAll()">↺ Atualizar</button></div>
</div>

<div id="main">
  <div>
    <div class="sh">🚨 <span style="color:#ef4444">ALERTA DE FECHAMENTO</span> <span class="sc" id="cnt-fech" style="border-color:#ef4444;color:#ef4444">0</span></div>
    <div class="lead-grid" id="grid-fech"><div class="em">Carregando...</div></div>
  </div>
  <div>
    <div class="sh">⚡ <span style="color:#eab308">INTENÇÃO DE COMPRA</span> <span class="sc" id="cnt-int" style="border-color:#eab308;color:#eab308">0</span></div>
    <div class="lead-grid" id="grid-int"><div class="em">Carregando...</div></div>
  </div>
</div>

<div id="chat-overlay" onclick="overlayClose(event)">
  <div id="chat-panel">
    <div id="chat-hdr">
      <div class="ch-av" id="ch-av">?</div>
      <div><div class="ch-nm" id="ch-nm">–</div><div class="ch-sb" id="ch-sb">–</div></div>
      <button class="ch-cl" onclick="closeChat()" title="Fechar">✕</button>
    </div>
    <div id="chat-msgs"></div>
  </div>
</div>

<script>
const TK='dc_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjZhMDY2N2IwMTg4NTc3ODM5YmFhZmI5YiIsInRlbmFudElkIjoiMGNkN2ZiM2YtYTQwMS00Y2I5LWEzOTYtZjAwZWYxN2I5ZGMwIiwibmFtZSI6IkNsYXVkZSIsInJvbGVzIjpbImFkbWluIl0sImlzQWRtaW4iOnRydWUsImlhdCI6MTc3ODgwNDY1N30.ZfDi6HWtD67qwYZzhU-Rrd3hAy1N5fMMU8WpiXKwSqA';
const CRM='https://crm.g1.datacrazy.io/api/crm';
const MSG='https://messaging.g1.datacrazy.io/api/messaging';
const FECHAMENTO_ID='17804096-eec5-4c99-bf5f-085153fab099';
const VE=['Jeremias','Alysson','Luan','Michele'];
const VC={Jeremias:'#22c55e',Alysson:'#f97316',Luan:'#3b82f6',Michele:'#a855f7'};
const BKW=['pix','cartão','boleto','link de pagamento','desconto','comprar','valor','preço','quanto é','fechar','manda o link','quero comprar','como pago','forma de pagamento'];

const BATCH_SIZE=6;
const BATCH_DELAY=200;
const MAX_CONVS_MSGS=80;

let _aa=null;          // alerta ativo
let _cv=[];            // conversas das últimas 24h
let _cvAll=[];         // TODAS as conversas (sem filtro de data) — populado em background
let _acts=[];          // atividades de fechamento do CRM
let _cm={};            // mensagens cacheadas: id → {conv, allMsgs, clientMsgs, lastClientMsg}
let _phoneToConv={};   // index telefone → conversa, para lookup O(1)

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function apiFetch(b,p,q={},retries=2){
  const u=new URL(b+p);
  Object.entries(q).forEach(([k,v])=>u.searchParams.set(k,v));
  for(let i=0;i<=retries;i++){
    try{
      const r=await fetch(u,{headers:{Authorization:'Bearer '+TK}});
      if(!r.ok){
        if(r.status===429||r.status>=500){
          if(i<retries){ await sleep(500*(i+1)); continue; }
        }
        throw new Error(r.status+' '+p);
      }
      return r.json();
    }catch(e){
      if(i<retries){ await sleep(500*(i+1)); continue; }
      throw e;
    }
  }
}

async function batchProcess(arr, fn, batchSize=BATCH_SIZE, delayMs=BATCH_DELAY){
  for(let i=0;i<arr.length;i+=batchSize){
    const chunk=arr.slice(i,i+batchSize);
    await Promise.all(chunk.map(fn));
    if(i+batchSize<arr.length) await sleep(delayMs);
  }
}

function s24(){ return new Date(Date.now()-86400000).toISOString(); }

// Normaliza telefone: tira não-dígitos, remove DDI 55, retorna últimos 10-11 dígitos
function nph(p){
  if(!p) return '';
  let d=String(p).replace(/\D/g,'');
  if(d.startsWith('55') && d.length>=12) d=d.slice(2);
  return d;
}

// Compara dois telefones: pelos últimos 8 dígitos (parte exclusiva do número, sem DDD)
function phEq(a,b){
  const na=nph(a), nb=nph(b);
  if(!na||!nb) return false;
  if(na===nb) return true;
  // últimos 8 dígitos (número sem DDD e sem o 9 inicial)
  const ea=na.slice(-8), eb=nb.slice(-8);
  return ea.length===8 && ea===eb;
}

// Constrói index de telefone → conversa
function buildPhoneIndex(){
  _phoneToConv={};
  const all=[..._cvAll, ..._cv]; // _cv tem prioridade pois é mais recente
  all.forEach(c=>{
    const ph=c.contact?.phoneNumber||c.contact?.contactId||'';
    if(!ph) return;
    const key=nph(ph).slice(-8);
    if(key && !_phoneToConv[key]) _phoneToConv[key]=c;
  });
  // _cv tem prioridade — sobrescreve
  _cv.forEach(c=>{
    const ph=c.contact?.phoneNumber||c.contact?.contactId||'';
    if(!ph) return;
    const key=nph(ph).slice(-8);
    if(key) _phoneToConv[key]=c;
  });
}

function findConvByPhone(ph){
  if(!ph) return null;
  const key=nph(ph).slice(-8);
  if(!key) return null;
  const conv=_phoneToConv[key];
  if(!conv) return null;
  // se já temos mensagens cacheadas, retorna com elas
  if(_cm[conv.id]) return _cm[conv.id];
  return {conv, allMsgs:[], clientMsgs:[], lastClientMsg:null};
}

function tAgo(s){
  if(!s) return '–';
  const d=Date.now()-new Date(s).getTime(), m=Math.floor(d/60000);
  if(m<1) return 'agora';
  if(m<60) return m+'m';
  const h=Math.floor(m/60);
  if(h<24) return h+'h';
  return Math.floor(h/24)+'d';
}

function vColor(n){ for(const v of VE) if(n&&n.toLowerCase().includes(v.toLowerCase())) return VC[v]; return '#7070a0'; }
function vInit(n){ if(!n) return '?'; const p=n.trim().split(' '); return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function getMsgText(m){ return (m.body||m.interpretedContent||'').trim(); }
function cleanTxt(s){ return (s||'').replace(/[\u200B\u200C\u200D\uFEFF]/g,'').trim(); }
function isDefault(b){ const l=b.toLowerCase(); return l.includes('olá doutor, quero saber mais')||l.includes('ola doutor, quero saber mais'); }
function bestClientMsg(msgs){ const rev=[...msgs].reverse(); return rev.find(m=>{ const b=cleanTxt(getMsgText(m)); return b&&!isDefault(b); })||null; }

async function loadAll(){
  document.getElementById('upd-time').textContent='Atualizando...';
  try{
    await loadActivities();
    await loadConvs();
    document.getElementById('upd-time').textContent='Atualizado: '+new Date().toLocaleTimeString('pt-BR');
    // depois do load principal, busca todas as conversas em background pra resolver Fechamento
    loadAllConvsBg();
  }catch(e){
    console.error(e);
    document.getElementById('upd-time').textContent='Erro: '+e.message;
  }
}

async function loadActivities(){
  try{
    const d=await apiFetch(CRM,'/activities',{limit:200,stageId:FECHAMENTO_ID});
    _acts=d.data||d||[];
    const ids=['jer','aly','lua','mic'];
    VE.forEach((v,i)=>{
      const cnt=_acts.filter(a=>(a.attendant?.name||'').toLowerCase().includes(v.toLowerCase())).length;
      const el=document.getElementById('vp-'+ids[i]);
      if(el) el.textContent=cnt;
    });
  }catch(e){ _acts=[]; console.error('loadActivities',e); }
}

async function loadConvs(){
  try{
    const since=s24();
    const vd=await apiFetch(MSG,'/conversations',{limit:300,updatedAfter:since});
    const all=vd.data||vd.conversations||vd||[];
    _cv=all.filter(c=>(c.updatedAt||c.lastMessageAt||c.createdAt||'')>=since);

    let nv=0, pd=0;
    _cv.forEach(c=>{
      if(!(c.attendants||[]).length) nv++;
      const st=(c.status||'').toLowerCase();
      if(st==='pending'||st==='open') pd++;
    });
    document.getElementById('cnt-nv').textContent=nv;
    document.getElementById('cnt-pd').textContent=pd;

    const actPh=new Set(_acts.map(a=>nph(a.lead?.phone||a.lead?.rawPhone||'').slice(-8)).filter(Boolean));
    let nn=0;
    _cv.forEach(c=>{
      const ph=nph(c.contact?.phoneNumber||c.contact?.contactId||'').slice(-8);
      if(ph&&!actPh.has(ph)) nn++;
    });
    document.getElementById('cnt-nn').textContent=nn;

    buildPhoneIndex();

    // Carrega mensagens das conversas — prioriza as que casam com leads de fechamento
    const fechPhones=new Set(_acts.map(a=>nph(a.lead?.phone||a.lead?.rawPhone||'').slice(-8)).filter(Boolean));
    const priority=[];
    const rest=[];
    _cv.forEach(c=>{
      const k=nph(c.contact?.phoneNumber||c.contact?.contactId||'').slice(-8);
      if(k && fechPhones.has(k)) priority.push(c);
      else rest.push(c);
    });
    const toLoad=[...priority, ...rest].slice(0, MAX_CONVS_MSGS);

    _cm={};
    await batchProcess(toLoad, async c=>{
      try{
        const md=await apiFetch(MSG,'/conversations/'+c.id+'/messages',{limit:20});
        const allM=(md.data||md.messages||md||[]).filter(m=>!m.deleted&&!m.isInternal);
        const cl=allM.filter(m=>m.received===true);
        const lc=bestClientMsg(cl);
        _cm[c.id]={conv:c, allMsgs:allM, clientMsgs:cl, lastClientMsg:lc};
      }catch(e){
        _cm[c.id]={conv:c, allMsgs:[], clientMsgs:[], lastClientMsg:null};
      }
    });

    renderLeads();
  }catch(e){
    console.error('loadConvs',e);
    ['cnt-nv','cnt-pd','cnt-nn'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent='?'; });
    renderLeads();
  }
}

// Em background: baixa TODAS as conversas (sem filtro de data) para resolver leads de Fechamento antigos
async function loadAllConvsBg(){
  try{
    const d=await apiFetch(MSG,'/conversations',{limit:1000});
    _cvAll=d.data||d.conversations||d||[];
    buildPhoneIndex();

    // Para os leads de fechamento que casaram com conversa antiga, carrega as mensagens
    const fechMatches=[];
    _acts.forEach(a=>{
      const ph=a.lead?.phone||a.lead?.rawPhone||'';
      if(!ph) return;
      const m=findConvByPhone(ph);
      if(m && !_cm[m.conv.id]) fechMatches.push(m.conv);
    });

    if(fechMatches.length){
      await batchProcess(fechMatches, async c=>{
        try{
          const md=await apiFetch(MSG,'/conversations/'+c.id+'/messages',{limit:20});
          const allM=(md.data||md.messages||md||[]).filter(m=>!m.deleted&&!m.isInternal);
          const cl=allM.filter(m=>m.received===true);
          const lc=bestClientMsg(cl);
          _cm[c.id]={conv:c, allMsgs:allM, clientMsgs:cl, lastClientMsg:lc};
        }catch(e){
          _cm[c.id]={conv:c, allMsgs:[], clientMsgs:[], lastClientMsg:null};
        }
      });
      renderLeads();
    }
  }catch(e){ console.warn('loadAllConvsBg',e); }
}

function fAlert(t){
  if(_aa===t){ _aa=null; document.querySelectorAll('.ab').forEach(b=>b.classList.remove('act')); }
  else{ _aa=t; document.querySelectorAll('.ab').forEach(b=>b.classList.remove('act')); document.getElementById({nv:'ab-nv',nn:'ab-nn',pd:'ab-pd'}[t])?.classList.add('act'); }
  renderLeads();
}

function renderLeads(){
  let fech=_acts;
  if(_aa==='nv') fech=fech.filter(a=>!a.attendant?.name);

  let inten=[];
  Object.values(_cm).forEach(({conv,clientMsgs,lastClientMsg})=>{
    let kw='';
    for(const m of clientMsgs){
      const b=cleanTxt(getMsgText(m)).toLowerCase();
      if(!b||isDefault(b)) continue;
      const k=BKW.find(x=>b.includes(x));
      if(k){ kw=k; break; }
    }
    if(!kw) return;
    inten.push({conv, ct:conv.contact||{}, lastClientMsg, kw});
  });

  if(_aa==='nv') inten=inten.filter(x=>!(x.conv.attendants||[]).length);
  if(_aa==='pd') inten=inten.filter(x=>{ const s=(x.conv.status||'').toLowerCase(); return s==='pending'||s==='open'; });

  document.getElementById('cnt-fech').textContent=fech.length;
  const gf=document.getElementById('grid-fech');
  if(!fech.length){
    gf.innerHTML='<div class="em">Nenhum lead em fechamento</div>';
  } else {
    gf.innerHTML=fech.map(a=>{
      const nm=esc(a.lead?.name||'Lead');
      const phRaw=a.lead?.phone||a.lead?.rawPhone||'';
      const phDisp=phRaw.replace(/\D/g,'');
      const vn=a.attendant?.name||'';
      const ag=tAgo(a.createdAt||a.updatedAt);
      const cl=vColor(vn);
      const ini=vInit(nm);

      let pv='Sem mensagem recente do cliente.';
      let convId='';
      const mc=findConvByPhone(phRaw);
      if(mc){
        convId=mc.conv.id;
        if(mc.lastClientMsg){
          const t=cleanTxt(getMsgText(mc.lastClientMsg));
          if(t) pv=esc(t.substring(0,100));
        }
      }

      return '<div class="lc fech" data-cid="'+convId+'" data-ph="'+esc(phDisp)+'" data-nm="'+nm+'" data-vn="'+esc(vn)+'" onclick="openChat(this)">'+
        '<span class="lc-badge">Fechamento</span>'+
        '<div class="lc-top">'+
          '<div class="lc-av" style="background:'+cl+'">'+ini+'</div>'+
          '<div class="lc-info">'+
            '<div class="lc-name">'+nm+'</div>'+
            '<div class="lc-meta"><div class="lc-dot" style="background:'+cl+'"></div>'+esc(vn||'Sem vendedor')+'</div>'+
          '</div>'+
          '<div class="lc-time">'+ag+'</div>'+
        '</div>'+
        '<div class="lc-preview">'+pv+'</div>'+
        '<div class="lc-footer">'+
          (phDisp?'<span class="lc-phone">📱 '+phDisp+'</span>':'<span></span>')+
          '<span class="lc-open-btn">Ver conversa →</span>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  document.getElementById('cnt-int').textContent=inten.length;
  const gi=document.getElementById('grid-int');
  if(!inten.length){
    gi.innerHTML='<div class="em">Nenhuma intenção de compra detectada nas últimas 24h</div>';
  } else {
    gi.innerHTML=inten.map(({conv,ct,lastClientMsg,kw})=>{
      const nm=esc(ct.name||conv.name||'Contato');
      const phRaw=ct.phoneNumber||ct.contactId||'';
      const phDisp=phRaw.replace(/\D/g,'');
      const vn=(conv.attendants||[])[0]?.name||'';
      const cl=vColor(vn);
      const ini=vInit(nm);
      const ag=tAgo(conv.updatedAt||conv.lastMessageAt||'');
      let pv='Sem mensagem recente do cliente.';
      if(lastClientMsg){ const t=cleanTxt(getMsgText(lastClientMsg)); if(t) pv=esc(t.substring(0,100)); }
      return '<div class="lc" data-cid="'+conv.id+'" data-ph="'+esc(phDisp)+'" data-nm="'+nm+'" data-vn="'+esc(vn)+'" onclick="openChat(this)">'+
        '<div class="lc-top">'+
          '<div class="lc-av" style="background:'+cl+'">'+ini+'</div>'+
          '<div class="lc-info">'+
            '<div class="lc-name">'+nm+'</div>'+
            '<div class="lc-meta"><div class="lc-dot" style="background:'+cl+'"></div>'+esc(vn||'Sem vendedor')+'</div>'+
          '</div>'+
          '<div class="lc-time">'+ag+'</div>'+
        '</div>'+
        '<div class="lc-preview">'+pv+'</div>'+
        '<div class="lc-footer">'+
          (phDisp?'<span class="lc-phone">📱 '+phDisp+'</span>':'<span></span>')+
          '<div style="display:flex;align-items:center;gap:6px">'+
            '<span class="lc-kw">'+esc(kw)+'</span>'+
            '<span class="lc-open-btn">Ver conversa →</span>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }
}

async function openChat(el){
  const nm=el.dataset.nm||'Lead';
  const vn=el.dataset.vn||'';
  const ph=el.dataset.ph||'';
  let cid=el.dataset.cid||'';

  const av=document.getElementById('ch-av');
  av.textContent=vInit(nm);
  av.style.background=vColor(vn||nm);
  document.getElementById('ch-nm').textContent=nm;
  document.getElementById('ch-sb').textContent=vn?'Vendedor: '+vn:(ph||'—');

  const ov=document.getElementById('chat-overlay');
  ov.classList.add('open');
  document.body.style.overflow='hidden';

  const ms=document.getElementById('chat-msgs');
  ms.innerHTML='<div class="ml">Carregando conversa...</div>';

  try{
    if(!cid&&ph){
      const mc=findConvByPhone(ph);
      if(mc) cid=mc.conv.id;
    }

    if(!cid){
      ms.innerHTML='<div class="ml">Conversa não encontrada para este lead.</div>';
      return;
    }

    const md=await apiFetch(MSG,'/conversations/'+cid+'/messages',{limit:100});
    const arr=(md.data||md.messages||md||[]).filter(m=>!m.deleted&&!m.isInternal&&cleanTxt(getMsgText(m)));
    arr.sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));

    if(!arr.length){ ms.innerHTML='<div class="ml">Nenhuma mensagem encontrada.</div>'; return; }

    let h='';
    arr.forEach(m=>{
      const b=esc(cleanTxt(getMsgText(m)));
      if(!b) return;
      const rcv=m.received===true;
      const tm=m.createdAt?new Date(m.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
      if(rcv){
        h+='<div class="mb rcv">'+b+'<div class="mt">'+tm+'</div></div>';
      } else {
        const sn=m.attendant?.name||'';
        const isBot=!sn||/roberto|bot|auto/i.test(sn)||m.automated===true;
        if(isBot) h+='<div class="mb bot"><div class="ms bot">🤖 Dr. Roberto</div>'+b+'<div class="mt">'+tm+'</div></div>';
        else h+='<div class="mb hum"><div class="ms hum">'+esc(sn)+'</div>'+b+'<div class="mt">'+tm+'</div></div>';
      }
    });

    ms.innerHTML=h||'<div class="ml">Sem conteúdo de texto.</div>';
    scrollBot();
  }catch(e){
    console.error('openChat',e);
    ms.innerHTML='<div class="ml">Erro ao carregar: '+esc(e.message)+'</div>';
  }
}

function scrollBot(){
  const e=document.getElementById('chat-msgs');
  if(e) requestAnimationFrame(()=>requestAnimationFrame(()=>{ e.scrollTop=e.scrollHeight; }));
}
function closeChat(){ document.getElementById('chat-overlay').classList.remove('open'); document.body.style.overflow=''; }
function overlayClose(e){ if(e.target===document.getElementById('chat-overlay')) closeChat(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeChat(); });

loadAll();
setInterval(loadAll, 90000);
</script>
