<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LN Marketing — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#16161f;--bg4:#1c1c28;--border:#2a2a3a;--text:#e8e8f0;--muted:#7070a0;--accent:#6c63ff;--red:#ef4444;--orange:#f97316;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--yellow:#eab308}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:48px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto}
#topbar::-webkit-scrollbar{display:none}
.tb-brand{font-weight:700;font-size:14px;color:#fff;margin-right:4px;white-space:nowrap;flex-shrink:0}
.tb-brand span{color:var(--accent)}
.tb-div{width:1px;height:24px;background:var(--border);flex-shrink:0}
.ab{display:flex;align-items:center;gap:5px;padding:4px 10px;background:var(--bg4);border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:border-color .2s;white-space:nowrap;font-size:11px;color:var(--muted);flex-shrink:0}
.ab:hover{border-color:var(--accent)}.ab.act{border-color:var(--red);background:rgba(239,68,68,.08)}
.ab-n{font-weight:700;font-size:13px;color:var(--red)}
.vp{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600;border:1px solid transparent;white-space:nowrap;flex-shrink:0}
.vp .d{width:6px;height:6px;border-radius:50%}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.upd{font-size:10px;color:var(--muted);white-space:nowrap}
.btn-r{background:var(--bg4);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit;transition:color .2s,border-color .2s}
.btn-r:hover{color:#fff;border-color:var(--accent)}
#main{position:fixed;top:48px;left:0;right:0;bottom:0;display:flex}
#lcol{width:360px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#lhdr{padding:10px 12px 0;flex-shrink:0}
#lhdr h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
#llist{flex:1;overflow-y:auto;padding:0 8px 12px}
#llist::-webkit-scrollbar{width:4px}
#llist::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sh{display:flex;align-items:center;gap:6px;padding:10px 4px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);position:sticky;top:0;z-index:5;background:var(--bg2)}
.sc{background:var(--bg4);border:1px solid var(--border);padding:1px 7px;border-radius:10px;font-size:10px}
.lc{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:border-color .15s,background .15s}
.lc:hover{border-color:var(--accent);background:var(--bg4)}
.lc.act{border-color:var(--accent);background:rgba(108,99,255,.08)}
.lc.fech{border-left:3px solid var(--red);background:rgba(239,68,68,.04)}
.lc.fech:hover,.lc.fech.act{border-color:var(--red);background:rgba(239,68,68,.1)}
.lc-t{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:5px}
.lc-n{font-weight:600;font-size:13px;color:#fff}
.lc-a{font-size:10px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.lc-v{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-bottom:5px}
.lc-v .dot{width:7px;height:7px;border-radius:50%}
.lc-stg{background:rgba(239,68,68,.15);color:var(--red);font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase}
.lc-p{font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.lc-ph{font-size:10px;color:var(--muted);margin-top:4px}
.lc-kw{display:inline-block;font-size:9px;font-weight:600;padding:2px 6px;border-radius:5px;background:rgba(108,99,255,.15);color:var(--accent);text-transform:uppercase;margin-left:4px}
.em{text-align:center;padding:24px 16px;color:var(--muted);font-size:12px;line-height:1.6}
#rcol{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#cph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px}
#cph svg{opacity:.15}#cph p{font-size:14px}
#cpanel{display:none;flex-direction:column;height:100%;overflow:hidden}
#chdr{flex-shrink:0;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
#chdr .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.ch-nm{font-weight:600;font-size:14px;color:#fff}.ch-sb{font-size:11px;color:var(--muted)}
.ch-cl{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px;transition:color .2s,border-color .2s}
.ch-cl:hover{color:#fff;border-color:var(--muted)}
#cmsgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
#cmsgs::-webkit-scrollbar{width:4px}
#cmsgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.mb{max-width:72%;padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.5;word-break:break-word}
.mb.rcv{background:var(--bg4);color:var(--text);border-bottom-left-radius:3px;align-self:flex-start}
.mb.hum{background:rgba(168,85,247,.25);border:1px solid rgba(168,85,247,.3);color:var(--text);border-bottom-right-radius:3px;align-self:flex-end}
.mb.bot{background:rgba(34,197,94,.18);border:1px solid rgba(34,197,94,.25);color:var(--text);border-bottom-right-radius:3px;align-self:flex-end}
.ms{font-size:9px;font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.ms.hum{color:var(--purple)}.ms.bot{color:var(--green)}
.mt{font-size:9px;color:var(--muted);margin-top:4px;text-align:right}
.ml{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:640px){.vp{display:none}#lcol{width:100%;position:absolute;top:0;bottom:0;z-index:10;transition:transform .25s}#lcol.out{transform:translateX(-100%)}#rcol{width:100%;position:absolute;top:0;bottom:0}.ch-bk{display:flex!important}}
.ch-bk{display:none;align-items:center;gap:4px;background:none;border:none;color:var(--muted);cursor:pointer;font-family:inherit;font-size:12px}
</style>
</head>
<body>
<div id="topbar">
  <div class="tb-brand">LN <span>Marketing</span></div>
  <div class="tb-div"></div>
  <div class="ab" id="ab-nv" onclick="fAlert('nv')"><span>👤</span><span class="ab-n" id="cnt-nv">–</span><span>Sem Vendedor</span></div>
  <div class="ab" id="ab-nn" onclick="fAlert('nn')"><span>📋</span><span class="ab-n" id="cnt-nn">–</span><span>Sem Negócio</span></div>
  <div class="ab" id="ab-pd" onclick="fAlert('pd')"><span>⏳</span><span class="ab-n" id="cnt-pd">–</span><span>Pendentes</span></div>
  <div class="tb-div"></div>
  <div class="vp" style="border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.08)"><div class="d" style="background:#22c55e"></div><span style="color:#22c55e">Jeremias</span> <span id="vp-jer" style="color:var(--muted)">–</span></div>
  <div class="vp" style="border-color:rgba(249,115,22,.3);background:rgba(249,115,22,.08)"><div class="d" style="background:#f97316"></div><span style="color:#f97316">Alysson</span> <span id="vp-aly" style="color:var(--muted)">–</span></div>
  <div class="vp" style="border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.08)"><div class="d" style="background:#3b82f6"></div><span style="color:#3b82f6">Luan</span> <span id="vp-lua" style="color:var(--muted)">–</span></div>
  <div class="vp" style="border-color:rgba(168,85,247,.3);background:rgba(168,85,247,.08)"><div class="d" style="background:#a855f7"></div><span style="color:#a855f7">Michele</span> <span id="vp-mic" style="color:var(--muted)">–</span></div>
  <div class="tb-r"><span class="upd" id="upd-time">Carregando...</span><button class="btn-r" onclick="loadAll()">↺ Atualizar</button></div>
</div>
<div id="main">
  <div id="lcol">
    <div id="lhdr"><h2>Leads Ativos — Últimas 24h</h2></div>
    <div id="llist"><div class="em">Carregando leads...</div></div>
  </div>
  <div id="rcol">
    <div id="cph">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <p>Selecione um lead para abrir o chat</p>
    </div>
    <div id="cpanel">
 
     <div id="chdr">
        <button class="ch-bk" onclick="closeChat()">← Voltar</button>
        <div class="av" id="ch-av">?</div>
        <div><div class="ch-nm" id="ch-nm">–</div><div class="ch-sb" id="ch-sb">–</div></div>
        <button class="ch-cl" onclick="closeChat()">✕ Fechar</button>
      </div>
      <div id="cmsgs"></div>
    </div>
  </div>
</div>
<script>

const TK='dc_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjZhMDY2N2IwMTg4NTc3ODM5YmFhZmI5YiIsInRlbmFudElkIjoiMGNkN2ZiM2YtYTQwMS00Y2I5LWEzOTYtZjAwZWYxN2I5ZGMwIiwibmFtZSI6IkNsYXVkZSIsInJvbGVzIjpbImFkbWluIl0sImlzQWRtaW4iOnRydWUsImlhdCI6MTc3ODgwNDY1N30.ZfDi6HWtD67qwYZzhU-Rrd3hAy1N5fMMU8WpiXKwSqA';
const CRM='https://crm.g1.datacrazy.io/api/crm';
const MSG='https://messaging.g1.datacrazy.io/api/messaging';
const VE=['Jeremias','Alysson','Luan','Michele'];
const VC={Jeremias:'#22c55e',Alysson:'#f97316',Luan:'#3b82f6',Michele:'#a855f7'};
const BKW=['pix','cartão','boleto','link de pagamento','desconto','comprar','valor','preço','quanto é','fechar','manda o link','quero comprar','como pago','forma de pagamento'];
const IGN=['olá doutor, quero saber mais','ola doutor, quero saber mais'];
let _aa=null,_cv=[],_ct={},_dl=[],_cm={};
async function apiFetch(base,path,params={}){const u=new URL(base+path);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{headers:{Authorization:'Bearer '+TK}});if(!r.ok)throw new Error(r.status+' '+path);return r.json()}
function s24(){return new Date(Date.now()-86400000).toISOString()}
function nph(p){return p?p.replace(/\D/g,''):''}
function tAgo(s){const d=Date.now()-new Date(s).getTime(),m=Math.floor(d/60000);if(m<1)return 'agora';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d'}
function vColor(n){for(const v of VE)if(n&&n.toLowerCase().includes(v.toLowerCase()))return VC[v];return '#7070a0'}
function vInit(n){if(!n)return '?';const p=n.trim().split(' ');return(p[0][0]+(p[1]?p[1][0]:'')).toUpperCase()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function loadAll(){
  document.getElementById('upd-time').textContent='Atualizando...';
  try{await Promise.all([loadDeals(),loadConvs()]);document.getElementById('upd-time').textContent='Atualizado: '+new Date().toLocaleTimeString('pt-BR')}
  catch(e){document.getElementById('upd-time').textContent='Erro: '+e.message}
}
async function loadDeals(){
  try{const since=s24();const d=await apiFetch(CRM,'/deals',{limit:300,updatedAfter:since});_dl=(d.data||d.deals||d||[]).filter(x=>(x.updatedAt||x.lastActivity||'')>=since);
  const ids=['jer','aly','lua','mic'];VE.forEach((v,i)=>{const cnt=_dl.filter(x=>(x.assignedTo||x.owner||x.vendorName||'').toLowerCase().includes(v.toLowerCase())).length;const el=document.getElementById('vp-'+ids[i]);if(el)el.textContent=cnt})}
  catch(e){_dl=[];console.error('loadDeals',e)}
}
async function loadConvs(){
  try{const since=s24();const cd=await apiFetch(MSG,'/contacts',{limit:500});const ca=cd.data||cd.contacts||cd||[];_ct={};
  ca.forEach(c=>{if(c.phoneNumber)_ct[nph(c.phoneNumber)]=c;if(c.id)_ct['i'+c.id]=c});
  const vd=await apiFetch(MSG,'/conversations',{limit:300,updatedAfter:since});const all=vd.data||vd.conversations||vd||[];
  _cv=all.filter(c=>(c.updatedAt||c.lastMessageAt||c.createdAt||'')>=since);
  let nv=0,pd=0;_cv.forEach(c=>{if(!(c.assignedTo||c.assignee||c.userId))nv++;const st=(c.status||'').toLowerCase();if(st==='pending'||st==='open')pd++});
  document.getElementById('cnt-nv').textContent=nv;document.getElementById('cnt-pd').textContent=pd;
  const cph=new Set(_cv.map(c=>{const ct=_ct['i'+(c.contactId||c.contact?.id||'')];return ct?nph(ct.phoneNumber):''}).filter(Boolean));
  const dph=new Set(_dl.map(d=>nph(d.phone||d.contactPhone||'')).filter(Boolean));
  let nn=0;cph.forEach(p=>{if(!dph.has(p))nn++});document.getElementById('cnt-nn').textContent=nn;
  _cm={};await Promise.all(_cv.slice(0,120).map(async c=>{try{const md=await apiFetch(MSG,'/conversations/'+c.id+'/messages',{limit:6});const arr=(md.data||md.messages||md||[]).filter(m=>{const b=(m.content||m.text||m.body||m.interpretedContent||'').trim();const t=(m.type||'').toLowerCase();return b&&!['event','system','notification','activity'].includes(t)});_cm[c.id]={conv:c,msgs:arr}}catch(e){_cm[c.id]={conv:c,msgs:[]}}}));
  renderLeads()}catch(e){console.error('loadConvs',e);['cnt-nv','cnt-pd','cnt-nn'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent='?'});renderLeads()}
}
function fAlert(t){if(_aa===t){_aa=null;document.querySelectorAll('.ab').forEach(b=>b.classList.remove('act'))}else{_aa=t;document.querySelectorAll('.ab').forEach(b=>b.classList.remove('act'));const map={nv:'ab-nv',nn:'ab-nn',pd:'ab-pd'};document.getElementById(map[t])?.classList.add('act')}renderLeads()}
function renderLeads(){
  const list=document.getElementById('llist');
  let fech=_dl.filter(d=>{const st=(d.stage||d.pipelineStage||d.stageName||'').toLowerCase();return st.includes('fechamento')||st.includes('fechar')||st.includes('closing')});
  if(_aa==='nv')fech=fech.filter(d=>!(d.assignedTo||d.owner));
  let inten=[];
  Object.values(_cm).forEach(({conv,msgs})=>{const rcv=msgs.filter(m=>m.received===true||m.direction==='inbound');let kw='';for(const m of rcv){const b=(m.content||m.text||m.body||m.interpretedContent||'').toLowerCase().trim();if(IGN.includes(b))continue;const k=BKW.find(x=>b.includes(x));if(k){kw=k;break}}if(!kw)return;const ct=_ct['i'+(conv.contactId||conv.contact?.id||'')];const lm=msgs[0]||null;inten.push({conv,ct,lm,kw})});
  if(_aa==='nv')inten=inten.filter(x=>!(x.conv.assignedTo||x.conv.assignee||x.conv.userId));
  if(_aa==='pd')inten=inten.filter(x=>{const s=(x.conv.status||'').toLowerCase();return s==='pending'||s==='open'});
  let h='';
  h+='<div class="sh">🚨 <span style="color:var(--red)">ALERTA DE FECHAMENTO</span> <span class="sc" style="border-color:var(--red);color:var(--red)">'+fech.length+'</span></div>';
  if(!fech.length)h+='<div class="em">Nenhum lead em fechamento nas últimas 24h</div>';
  else fech.forEach(d=>{const nm=esc(d.name||d.contactName||d.title||'Lead');const vn=d.assignedTo||d.owner||d.vendorName||'';const ph=nph(d.phone||d.contactPhone||'');const ag=tAgo(d.updatedAt||d.lastActivity||'');const cl=vColor(vn);let pv='';if(ph){const mc=Object.values(_cm).find(cm=>{const cid=cm.conv.contactId||cm.conv.contact?.id||'';const ct=_ct['i'+cid];return ct&&nph(ct.phoneNumber)===ph});if(mc&&mc.msgs.length){const lm=mc.msgs[0];pv=esc((lm.content||lm.text||lm.body||lm.interpretedContent||'').trim().substring(0,80))}}
  h+='<div class="lc fech" data-type="deal" data-phone="'+ph+'" data-name="'+nm+'" data-vendor="'+esc(vn)+'" onclick="openChat(this)"><div class="lc-t"><div class="lc-n">'+nm+'</div><div class="lc-a">'+ag+'</div></div><div class="lc-v"><div class="dot" style="background:'+cl+'"></div><span>'+esc(vn||'Sem vendedor')+'</span><span class="lc-stg">Fechamento</span></div>'+(pv?'<div class="lc-p">'+pv+'</div>':'')+(ph?'<div class="lc-ph">📱 '+ph+'</div>':'')+'</div>'});
  h+='<div class="sh" style="margin-top:8px">⚡ <span style="color:var(--yellow)">INTENÇÃO DE COMPRA</span> <span class="sc" style="border-color:var(--yellow);color:var(--yellow)">'+inten.length+'</span></div>';
  if(!inten.length)h+='<div class="em">Nenhuma intenção detectada nas últimas 24h</div>';
  else inten.forEach(({conv,ct,lm,kw})=>{const nm=esc(ct?.name||conv.contactName||conv.name||'Contato');const ph=nph(ct?.phoneNumber||conv.phone||'');const vn=conv.assignedTo||conv.assignee||'';const cl=vColor(vn);const ag=tAgo(conv.updatedAt||conv.lastMessageAt||'');const pv=lm?esc((lm.content||lm.text||lm.body||lm.interpretedContent||'').trim().substring(0,80)):'';h+='<div class="lc" data-type="conv" data-convid="'+conv.id+'" data-phone="'+ph+'" data-name="'+nm+'" data-vendor="'+esc(vn)+'" onclick="openChat(this)"><div class="lc-t"><div class="lc-n">'+nm+'</div><div class="lc-a">'+ag+'</div></div><div class="lc-v"><div class="dot" style="background:'+cl+'"></div><span>'+esc(vn||'Sem vendedor')+'</span></div>'+(pv?'<div class="lc-p">'+pv+'</div>':'')+(ph?'<div class="lc-ph">📱 '+ph+(kw?'<span class="lc-kw">'+esc(kw)+'</span>':'')+'</div>':'')+'</div>'});
  list.innerHTML=h;
}
async function openChat(el){
  document.querySelectorAll('.lc').forEach(c=>c.classList.remove('act'));el.classList.add('act');
  const nm=el.dataset.name||'Lead';const vn=el.dataset.vendor||'';const ph=el.dataset.phone||'';let cid=el.dataset.convid||'';
  document.getElementById('cph').style.display='none';const panel=document.getElementById('cpanel');panel.style.display='flex';
  const av=document.getElementById('ch-av');av.textContent=vInit(nm);av.style.background=vColor(vn||nm);
  document.getElementById('ch-nm').textContent=nm;document.getElementById('ch-sb').textContent=vn?'Vendedor: '+vn:(ph||'—');
  if(window.innerWidth<=640)document.getElementById('lcol').classList.add('out');
  const cmsgs=document.getElementById('cmsgs');cmsgs.innerHTML='<div class="ml">Carregando conversa...</div>';
  try{
    if(!cid&&ph){const mc=_cv.find(c=>{const ct=_ct['i'+(c.contactId||c.contact?.id||'')];return ct&&nph(ct.phoneNumber)===ph});if(mc)cid=mc.id}
    if(!cid){cmsgs.innerHTML='<div class="ml">Conversa não encontrada para este lead.</div>';return}
    const md=await apiFetch(MSG,'/conversations/'+cid+'/messages',{limit:100});
    const arr=(md.data||md.messages||md||[]).filter(m=>{const b=(m.content||m.text||m.body||m.interpretedContent||'').trim();const t=(m.type||'').toLowerCase();return b&&!['event','system','notification','activity'].includes(t)});
    arr.sort((a,b)=>new Date(a.createdAt||a.timestamp||0)-new Date(b.createdAt||b.timestamp||0));
    if(!arr.length){cmsgs.innerHTML='<div class="ml">Nenhuma mensagem encontrada.</div>';return}
    let h='';arr.forEach(m=>{const b=esc((m.content||m.text||m.body||m.interpretedContent||'').trim());const rcv=m.received===true||m.direction==='inbound';const ts=m.createdAt||m.timestamp||'';const tm=ts?new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';if(rcv){h+='<div class="mb rcv">'+b+'<div class="mt">'+tm+'</div></div>'}else{const sn=m.senderName||m.agentName||m.userName||m.sender?.name||'';const isBot=!sn||sn.toLowerCase().includes('roberto')||sn.toLowerCase().includes('bot')||sn.toLowerCase().includes('auto')||m.automated===true||m.isBot===true;if(isBot){h+='<div class="mb bot"><div class="ms bot">🤖 Dr. Roberto</div>'+b+'<div class="mt">'+tm+'</div></div>'}else{h+='<div class="mb hum"><div class="ms hum">'+esc(sn)+'</div>'+b+'<div class="mt">'+tm+'</div></div>'}}});
    cmsgs.innerHTML=h;scrollBot();
  }catch(e){cmsgs.innerHTML='<div class="ml">Erro: '+esc(e.message)+'</div>'}
}
function scrollBot(){const el=document.getElementById('cmsgs');if(!el)return;requestAnimationFrame(()=>requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight}))}
function closeChat(){document.getElementById('cph').style.display='flex';document.getElementById('cpanel').style.display='none';document.querySelectorAll('.lc').forEach(c=>c.classList.remove('act'));document.getElementById('lcol').classList.remove('out')}
loadAll();setInterval(loadAll,60000);
</script>
</body>
